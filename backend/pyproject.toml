[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "secureeval-backend"
version = "0.1.0"
description = "SecureEval FastAPI backend"
requires-python = "==3.14.*"
dependencies = [
  "alembic==1.19.1",
  "bandit==1.9.4",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pandas==3.0.5",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "semgrep==1.175.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
